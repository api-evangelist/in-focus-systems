name: In Focus Systems
description: >-
  In Focus Systems, Inc. (later InFocus Corporation, and today marketed as
  InFocus) is an audiovisual technology company founded in 1986 in Oregon by
  Steve Hix and Paul Gulick, both formerly of Tektronix. The company pioneered
  LCD projection panels and is credited with inventing the digital projector,
  going public on NASDAQ (ticker INFS) in December 1990. It grew into a leading
  maker of DLP and LCD projectors, interactive flat-panel displays, DVLED video
  walls, and collaboration hardware for business, education, installation, and
  home markets. In Focus Systems was an early Battery Ventures investment (since
  exited). The InFocus business was acquired by Image Holdings Corp. in 2009 and
  operates today as a privately held subsidiary headquartered in the Portland,
  Oregon area. It is a hardware and audiovisual solutions company and does not
  publish a public developer API, SDKs, or a developer portal.
